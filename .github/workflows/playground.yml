name: Build Koka Playground

on:
  push:
    branches: [feature/ghcjs-playground, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GHCJS_VERSION: 'javascript-unknown-ghcjs-9.10.0.20240413'
  EMSCRIPTEN_VERSION: '3.1.51'

jobs:
  build:
    name: Build Playground
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Setup toolchains ──────────────────────────────────────────────

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Setup GHC + Cabal + Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'
          cabal-version: '3.16'
          enable-stack: true
          stack-version: 'latest'

      - name: Install GHC JS cross-compiler via ghcup
        run: |
          export PATH="$HOME/.cabal/bin:$PATH"
          # Add ghcup cross-compiler channel
          ghcup config add-release-channel cross
          # Install the JS cross-compiler (emconfigure wraps it for emscripten)
          emconfigure ghcup install ghc ${{ env.GHCJS_VERSION }}
          # Verify
          ghcup run --ghc ${{ env.GHCJS_VERSION }} -- javascript-unknown-ghcjs-ghc --version
          echo "$HOME/.ghcup/bin" >> $GITHUB_PATH

      - name: Install hpack
        run: |
          export PATH="$HOME/.cabal/bin:$PATH"
          cabal update
          cabal install hpack --overwrite-policy=always
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH

      # ── Cache cabal packages ─────────────────────────────────────────

      - name: Cache cabal packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-js-${{ env.GHCJS_VERSION }}-${{ hashFiles('package.yaml') }}
          restore-keys: cabal-js-${{ env.GHCJS_VERSION }}-

      # ── Build Koka for JS ────────────────────────────────────────────

      - name: Generate cabal file
        run: hpack

      - name: Build Koka library + playground
        run: |
          GHC_JS=$(ghcup whereis ghc ${{ env.GHCJS_VERSION }})
          cabal build lib:koka exe:koka-playground \
            --with-compiler="$GHC_JS"

      - name: Patch JS output
        run: |
          # Find the RTS wasm from the ghcup-installed GHC
          GHC_JS_LIBDIR=$(ghcup run --ghc ${{ env.GHCJS_VERSION }} -- javascript-unknown-ghcjs-ghc --print-libdir)
          if [ -f "$GHC_JS_LIBDIR/../rts/build/a.wasm" ]; then
            cp "$GHC_JS_LIBDIR/../rts/build/a.wasm" ghc-rts.wasm
          else
            # Search for it
            find "$(dirname $GHC_JS_LIBDIR)" -name "a.wasm" -path "*/rts/*" | head -1 | xargs -I{} cp {} ghc-rts.wasm
          fi
          ./scripts/patch-jsexe.sh

      # ── Precompile std library ───────────────────────────────────────

      - name: Build native Koka + precompile stdlib
        run: |
          stack build koka:exe:koka-plain --fast --no-terminal
          KOKA=$(stack exec -- which koka-plain)
          mkdir -p precompiled
          $KOKA --target=js --outputdir=precompiled --library lib/std/core.kk

      # ── Build web frontend ───────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      # ── Assemble static site ─────────────────────────────────────────

      - name: Assemble deployment
        run: |
          mkdir -p deploy

          JSEXE=$(find dist-newstyle -name "koka-playground.jsexe" -type d | head -1)

          # Web frontend
          cp -r web/dist/* deploy/

          # Compiler JS bundle
          cp "$JSEXE/all.js" deploy/all.js
          cp "$JSEXE/koka-playground.wasm" deploy/koka-playground.wasm

          # Stdlib sources
          mkdir -p deploy/lib
          cp -r lib/std deploy/lib/std

          # Precompiled interfaces + runtime
          mkdir -p deploy/precompiled
          cp precompiled/*.kki precompiled/*.mjs deploy/precompiled/

          # Generate manifests
          cd deploy
          python3 -c "
          import json, os
          files = []
          for root, dirs, fnames in os.walk('lib/std'):
              for f in fnames:
                  files.append(os.path.join(root, f).replace('lib/', ''))
          print(json.dumps(sorted(files)))
          " > stdlib-manifest.json

          ls precompiled/ | python3 -c "
          import sys, json
          print(json.dumps(sorted([l.strip() for l in sys.stdin])))
          " > precompiled-manifest.json

          echo "=== Deployment ==="
          du -sh .
          du -h all.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  # ── Deploy to GitHub Pages ───────────────────────────────────────────

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/ghcjs-playground' || github.ref == 'refs/heads/dev')

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
