name: Build Koka Playground

on:
  push:
    branches: [feature/ghcjs-playground, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GHC_WASM_META_FLAVOUR: '9.12'

jobs:
  build:
    name: Build Playground
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Setup toolchains ──────────────────────────────────────────────

      - name: Setup GHC + Cabal + Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12'
          cabal-version: '3.16'
          enable-stack: true
          stack-version: 'latest'

      - name: Install GHC WASM backend
        run: |
          curl -sL "https://gitlab.haskell.org/ghc/ghc-wasm-meta/-/raw/master/bootstrap.sh" | \
            FLAVOUR=${{ env.GHC_WASM_META_FLAVOUR }} sh
          source ~/.ghc-wasm/env
          wasm32-wasi-ghc --version

      - name: Install hpack
        run: |
          export PATH="$HOME/.cabal/bin:$PATH"
          cabal update
          cabal install hpack --overwrite-policy=always
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH

      # ── Cache ──────────────────────────────────────────────────────────

      - name: Cache cabal packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-wasm-${{ env.GHC_WASM_META_FLAVOUR }}-${{ hashFiles('package.yaml') }}
          restore-keys: cabal-wasm-${{ env.GHC_WASM_META_FLAVOUR }}-

      # ── Build WASM binaries ────────────────────────────────────────────

      - name: Generate cabal file
        run: hpack

      - name: Build WASM compiler + LSP
        run: |
          source ~/.ghc-wasm/env
          wasm32-wasi-cabal build lib:koka koka:exe:koka-playground koka:exe:koka-lsp-wasm

      - name: Optimize WASM binaries
        run: |
          source ~/.ghc-wasm/env
          WASM_OPT=~/.ghc-wasm/binaryen/bin/wasm-opt

          PLAYGROUND=$(find dist-newstyle -name "koka-playground.wasm" -path "*/wasm32-wasi/*" | head -1)
          $WASM_OPT -Oz "$PLAYGROUND" -o "${PLAYGROUND%.wasm}.opt.wasm"
          echo "Playground: $(du -h "${PLAYGROUND%.wasm}.opt.wasm" | cut -f1) (from $(du -h "$PLAYGROUND" | cut -f1))"

          LSP=$(find dist-newstyle -name "koka-lsp-wasm.wasm" -path "*/wasm32-wasi/*" | head -1)
          $WASM_OPT -Oz "$LSP" -o "${LSP%.wasm}.opt.wasm"
          echo "LSP: $(du -h "${LSP%.wasm}.opt.wasm" | cut -f1) (from $(du -h "$LSP" | cut -f1))"

      # ── Precompile std library ───────────────────────────────────────

      - name: Build native Koka + precompile stdlib
        run: |
          stack build koka:exe:koka-plain --fast --no-terminal
          KOKA=$(stack exec -- which koka-plain)
          mkdir -p precompiled
          $KOKA --target=js --outputdir=precompiled --library lib/toc.kk

      # ── Build web frontend ───────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web frontend
        run: |
          cd web
          npm install
          npm run build

      # ── Assemble static site ─────────────────────────────────────────

      - name: Assemble deployment
        run: |
          mkdir -p deploy

          # Web frontend
          cp -r web/dist/* deploy/

          # WASM compiler binary
          WASM_OPT=$(find dist-newstyle -name "koka-playground.opt.wasm" -path "*/wasm32-wasi/*" | head -1)
          cp "$WASM_OPT" deploy/koka-playground.wasm

          # WASM LSP binary
          LSP_OPT=$(find dist-newstyle -name "koka-lsp-wasm.opt.wasm" -path "*/wasm32-wasi/*" | head -1)
          cp "$LSP_OPT" deploy/koka-lsp.wasm

          # coi-serviceworker for SharedArrayBuffer support
          cp web/node_modules/coi-serviceworker/coi-serviceworker.min.js deploy/coi-serviceworker.js

          # Stdlib sources (needed for inline externs)
          mkdir -p deploy/lib
          cp -r lib/std deploy/lib/std

          # Precompiled interfaces + runtime
          mkdir -p deploy/precompiled
          cp precompiled/*.kki precompiled/*.mjs deploy/precompiled/

          # Generate manifests
          cd deploy
          python3 -c "
          import json, os
          files = []
          for root, dirs, fnames in os.walk('lib/std'):
              for f in fnames:
                  files.append(os.path.join(root, f).replace('lib/', ''))
          print(json.dumps(sorted(files)))
          " > stdlib-manifest.json

          ls precompiled/ | python3 -c "
          import sys, json
          print(json.dumps(sorted([l.strip() for l in sys.stdin])))
          " > precompiled-manifest.json

          echo "=== Deployment ==="
          du -sh .
          du -h koka-playground.wasm koka-lsp.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  # ── Deploy to GitHub Pages ───────────────────────────────────────────

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/ghcjs-playground' || github.ref == 'refs/heads/dev')

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
