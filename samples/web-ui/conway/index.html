<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koka — Game of Life</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 15px/1.5 system-ui, sans-serif; background: #16161e; color: #e6e6f0; }
  .wrap { max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; color: #7aa2f7; }
  .controls { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem; }
  .controls button { padding: .3rem .8rem; cursor: pointer; border: 1px solid #7aa2f755;
                     border-radius: 6px; background: #232433; color: #e6e6f0; }
  .hint { font-size: .85rem; opacity: .7; }
  .grid { display: inline-flex; flex-direction: column; gap: 1px; background: #2a2b3d;
          padding: 1px; border-radius: 4px; }
  .gridrow { display: flex; gap: 1px; }
  .cell { width: 16px; height: 16px; background: #1c1d2b; cursor: pointer; }
  .cell.alive { background: #9ece6a; }
</style>
<div id="app"></div>
<script type="module">
  import { runKoka } from "./web-ui-host.js";
  await runKoka("./app.wasm");
</script>
